<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc"><title id="title">ERNIE Harness illustrative workspace</title><desc id="desc">Authored interface illustration, not a live screenshot or benchmark result. Three interfaces share a persistent execution core.</desc><rect width="1120" height="570" rx="18" fill="#080c14"/><rect x="16" y="16" width="1088" height="538" rx="12" fill="#101827" stroke="#304361"/><g font-family="system-ui,sans-serif"><text x="42" y="55" fill="#d8e7ff" font-size="20" font-weight="700">ERNIE HARNESS</text><text x="1070" y="54" text-anchor="end" fill="#b5c1d3" font-size="13">ILLUSTRATIVE DEMO · NO MODEL CALL</text><path d="M16 78h1088M247 78v476" stroke="#304361"/><g fill="#b4c6e2" font-size="15"><text x="44" y="121">WORKSPACES</text><text x="44" y="164">▸ my-project</text><text x="58" y="207" fill="#9bc2ff">Fix empty input</text><text x="58" y="244">Review export module</text><text x="44" y="489">Local service</text><text x="44" y="516" font-size="12">Credentials stay on server</text></g><text x="280" y="119" fill="#8fbaff" font-size="14">CLI / WEB / PERSISTENT GOALS</text><rect x="279" y="148" width="791" height="62" rx="10" fill="#1a2941"/><text x="300" y="185" fill="#edf4ff" font-size="17">Fix the empty-array case and add a regression test.</text><text x="300" y="250" fill="#c3d2e7" font-size="17">Inspect the implementation and tests before editing.</text><g fill="#182a43" stroke="#35547a"><rect x="300" y="278" width="206" height="52" rx="7"/><rect x="523" y="278" width="206" height="52" rx="7"/><rect x="746" y="278" width="206" height="52" rx="7"/></g><g fill="#aacbff" font-size="15"><text x="324" y="310">01  Read files</text><text x="547" y="310">02  Apply patch</text><text x="770" y="310">03  Run tests</text></g><text x="300" y="383" fill="#93accc" font-size="15">Goal revision → tool journal → acceptance evidence</text><path d="M300 411h725" stroke="#304361"/><text x="300" y="450" fill="#d4e4ff" font-size="17">One writer per workspace. Reconcile before resuming.</text><text x="300" y="493" fill="#a7b5c9" font-size="14">Live learning and formal comparison: pending validation.</text></g></svg>
